services:
  mysql:
    image: mysql:8.0
    container_name: compulab_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: compulab_db
      MYSQL_USER: compulab_user
      MYSQL_PASSWORD: compulab_password
      TZ: America/Santiago
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: compulab_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: compulab_user
      PMA_PASSWORD: compulab_password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:

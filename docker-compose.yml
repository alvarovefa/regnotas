services:
  mysql:
    image: mysql:8.0
    container_name: compulab_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: compulab_db
      MYSQL_USER: compulab_user
      MYSQL_PASSWORD: compulab_password
      TZ: America/Santiago
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: compulab_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: compulab_user
      PMA_PASSWORD: compulab_password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: compulab_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend/storage/uploads:/app/storage/uploads
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: compulab_user
      DB_PASSWORD: compulab_password
      DB_NAME: compulab_db
    depends_on:
      - mysql
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: compulab_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  backend_dev:
    build: ./backend
    container_name: compulab_backend_dev
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: compulab_user
      DB_PASSWORD: compulab_password
      DB_NAME: compulab_db
    depends_on:
      - mysql
    restart: unless-stopped

  frontend_dev:
    build: ./frontend
    container_name: compulab_frontend_dev
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://backend_dev:3000
    depends_on:
      - backend_dev
    restart: unless-stopped

volumes:
  mysql_data:
